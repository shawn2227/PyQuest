{% extends 'base.html' %}

{% block content %}
<div style="max-width: 850px; margin: 0 auto;">
    <div style="margin-bottom: 1.5rem;">
        <a href="{{ url_for('category_detail', slug=quest.cat_slug) }}" class="btn-outline" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
            ← Back to Sector
        </a>
    </div>

    <div class="glass-card" style="padding: 2.5rem;">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-subtle);">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">📚</div>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center;">
                <span class="hero-tag" style="margin-bottom: 0; background: {{ quest.accent_color }}22; border-color: {{ quest.accent_color }}55; color: {{ quest.accent_color }};">{{ quest.cat_title }}</span>
                <span class="hero-tag" style="margin-bottom: 0; background: rgba(255, 255, 255, 0.05); color: var(--text-secondary);">{{ quest.difficulty }}</span>
            </div>
            <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">{{ quest.title }}</h1>
            <p style="color: var(--neon-amber); font-weight: 700; font-size: 1.1rem;">Reward: +{{ quest.xp_reward }} XP</p>
        </div>

        <div class="learning-material" style="font-size: 1.05rem; line-height: 1.7; color: var(--text-primary);">
            {{ quest.learning_material | safe }}
        </div>

        <div style="margin-top: 3rem; text-align: center;">
            <a href="{{ url_for('quest_arena', quest_id=quest.id) }}" class="btn-glow btn-primary" style="font-size: 1.2rem; padding: 1rem 2.5rem; border-radius: 16px; background: linear-gradient(135deg, {{ quest.accent_color }}, var(--neon-purple)); box-shadow: 0 8px 30px {{ quest.accent_color }}66;">
                START MISSION ⚡
            </a>
        </div>
    </div>
</div>
{% endblock %}
